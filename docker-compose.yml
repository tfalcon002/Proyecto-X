services:
  postgres:
    # Imagen con la extensión pgvector preinstalada (superset de postgres:16,
    # sirve igual para la base de n8n que para la base vectorial del RAG).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RAG_DB: ${RAG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Usadas por workflows/whatsapp-rag-inbound.json vía expresiones $env.*
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      WHISPER_API_URL: ${WHISPER_API_URL}
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      WHISPER_MODEL: ${WHISPER_MODEL}
      RAG_API_URL: ${RAG_API_URL}
      RAG_API_KEY: ${RAG_API_KEY}
      # Usadas por el mismo workflow para agendar citas (Cal.com) y disparar
      # notificaciones multicanal (Novu) — ver workflows/README.md
      CALCOM_API_URL: ${CALCOM_API_URL}
      CALCOM_API_KEY: ${CALCOM_API_KEY}
      CALCOM_API_VERSION: ${CALCOM_API_VERSION}
      CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID}
      CALCOM_TIMEZONE: ${CALCOM_TIMEZONE}
      NOVU_API_URL: ${NOVU_API_URL}
      NOVU_API_KEY: ${NOVU_API_KEY}
      NOVU_WORKFLOW_ID: ${NOVU_WORKFLOW_ID}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  rag:
    build: ./rag-service
    restart: unless-stopped
    ports:
      - "${RAG_PORT}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${RAG_DB}
      RAG_API_KEY: ${RAG_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
