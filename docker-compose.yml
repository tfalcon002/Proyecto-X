services:
  postgres:
    # Imagen con la extensión pgvector preinstalada (superset de postgres:16,
    # sirve igual para la base de n8n que para la base vectorial del RAG).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RAG_DB: ${RAG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # n8n 2.x bloquea $env en los nodos por defecto; el workflow depende de él.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Usadas por workflows/whatsapp-rag-inbound.json vía expresiones $env.*
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      WHISPER_API_URL: ${WHISPER_API_URL}
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      WHISPER_MODEL: ${WHISPER_MODEL}
      RAG_API_URL: ${RAG_API_URL}
      RAG_API_KEY: ${RAG_API_KEY}
      FALCON_CLIENT_ID: ${FALCON_CLIENT_ID}
      # Usadas por el mismo workflow para agendar citas (Cal.com) y disparar
      # notificaciones multicanal (Novu) — ver workflows/README.md
      CALCOM_API_URL: ${CALCOM_API_URL}
      CALCOM_API_KEY: ${CALCOM_API_KEY}
      CALCOM_API_VERSION: ${CALCOM_API_VERSION}
      CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID}
      CALCOM_TIMEZONE: ${CALCOM_TIMEZONE}
      NOVU_API_URL: ${NOVU_API_URL}
      NOVU_API_KEY: ${NOVU_API_KEY}
      NOVU_WORKFLOW_ID: ${NOVU_WORKFLOW_ID}
      # Negocios que no agendan citas: "false" apaga el camino de Cal.com.
      AGENDA_ENABLED: ${AGENDA_ENABLED:-true}
      # "true" para responder con nota de voz cuando el cliente manda un audio
      VOICE_REPLIES_ENABLED: ${VOICE_REPLIES_ENABLED:-false}
      # Derivación a una persona — ver workflows/README.md
      HANDOFF_NOTIFY_NUMBER: ${HANDOFF_NOTIFY_NUMBER}
      HANDOFF_REPLY: ${HANDOFF_REPLY}
      HANDOFF_TEMPLATE_NAME: ${HANDOFF_TEMPLATE_NAME}
      HANDOFF_TEMPLATE_LANG: ${HANDOFF_TEMPLATE_LANG:-es}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  rag:
    build: ./rag-service
    restart: unless-stopped
    ports:
      - "${RAG_PORT}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${RAG_DB}
      RAG_API_KEY: ${RAG_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # Solo si LLM_PROVIDER=gemini o EMBEDDING_PROVIDER=gemini (ver rag-service/README.md)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-6}
      HISTORY_HOURS: ${HISTORY_HOURS:-24}
      HANDOFF_PAUSE_HOURS: ${HANDOFF_PAUSE_HOURS:-12}
      # Notas de voz (POST /v1/voice-replies, ver rag-service/README.md)
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-opus_48000_64}
      VOICE_MAX_CHARS: ${VOICE_MAX_CHARS:-600}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
