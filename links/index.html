<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon | Enlaces Oficiales</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; padding: 40px 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; background: #222; margin: 0 auto 15px; border: 2px solid #c59b27; }
        h1 { font-size: 1.4rem; color: #c59b27; margin-bottom: 5px; }
        p { font-size: 0.9rem; color: #a0a0a0; margin-bottom: 25px; }
        .link-card { display: block; background: #1a1a1a; color: #fff; text-decoration: none; padding: 16px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; font-weight: 600; transition: all 0.2s ease; }
        .link-card:hover { border-color: #c59b27; transform: translateY(-2px); background: #222; }
        .primary { background: #c59b27; color: #000; border: none; }
        .primary:hover { background: #e0b338; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-img"></div>
        <h1>Falcon</h1>
        <p>Soluciones Digitales & Automatización</p>

        <!-- Botón Principal (Landing) -->
        <a href="https://tfalcon002.github.io/Proyecto-X/" class="link-card primary">🌐 Sitio Web Oficial</a>

        <!-- Futuros Canales -->
        <a href="#" class="link-card">💬 WhatsApp Directo</a>
        <a href="#" class="link-card">💼 LinkedIn</a>
        <a href="#" class="link-card">🎵 TikTok</a>
        <a href="#" class="link-card">▶️ YouTube</a>
    </div>
</body>
</html>
